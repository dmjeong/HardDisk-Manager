name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # A Framework solution must evaluate and build without resolving a .NET SDK.
      MSBuildSDKsPath: '${{ github.workspace }}\sdk-disabled'
      DOTNET_MSBUILD_SDK_RESOLVER_CLI_DIR: '${{ github.workspace }}\sdk-disabled'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build WPF, service, sensor host and package
        shell: powershell
        run: ./scripts/Build.ps1
      - name: .NET Framework 4.8 and real NTFS integration tests
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Visual Studio WPF design-time project evaluation
        shell: powershell
        run: |
          msbuild src/ExplorerManager.Desktop/ExplorerManager.Desktop.csproj /t:ResolveReferences /p:Configuration=Release /p:DesignTimeBuild=true /p:BuildingInsideVisualStudio=true /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First-run desktop, setup, real controls and policy workflow
        shell: powershell
        run: ./scripts/Desktop-Workflow.ps1
      - name: Upgrade from 1.0.1 with installed Desktop running
        shell: powershell
        run: ./scripts/Upgrade-Workflow.ps1
      - name: Service install, authenticated IPC, WPF render, uninstall
        shell: powershell
        run: ./scripts/Smoke.ps1
      - name: Save service diagnostics
        if: failure()
        shell: powershell
        run: |
          New-Item artifacts -ItemType Directory -Force | Out-Null
          foreach ($log in @('Application','System')) {
            Get-WinEvent -FilterHashtable @{LogName=$log;StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Explorer.?Manager' } |
              Select-Object TimeCreated,Id,ProviderName,Message | Format-List | Out-File "artifacts/$log-events.log"
          }
          Copy-Item "$env:ProgramData/ExplorerManager/Data/*.log" artifacts -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/ExplorerManager/Logs/*.log" artifacts -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExplorerManager-win-x64
          path: |
            artifacts/ExplorerManager-win-x64.zip
            artifacts/*.png
            artifacts/*.log
            **/TestResults/*.trx
            **/TestResults/**/*.xml
            *smoke*.log
            *binding*.log
